[package]
name = "jev-assist-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
base64 = "0.22"
httpdate = "1.0"
regex = "1.12"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "native-tls", "http2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time", "net"] }
uuid = { version = "1.0", features = ["v4"] }

[profile.release]
lto = "thin"
strip = true
